name: Deploy Hybrid XAI pilot

on:
  workflow_dispatch:
    inputs:
      deploy_service:
        description: Update the existing pilot ECS service
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-hybrid-xai-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: phisharg-hybrid
      ECS_CONTAINER: phisharg-hybrid
      HYBRID_MODEL_S3_KEY: hybrid/multilingual-candidate-v3-curated/v1/model.zip
      ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
      HYBRID_TASK_ROLE_ARN: ${{ vars.HYBRID_TASK_ROLE_ARN }}
      API_KEY_SECRET_ARN: ${{ vars.API_KEY_SECRET_ARN }}
      TOKEN_KEY_SECRET_ARN: ${{ vars.TOKEN_KEY_SECRET_ARN }}
      HYBRID_MODEL_BUCKET: ${{ vars.HYBRID_MODEL_BUCKET }}
      HYBRID_MODEL_VERSION_ID: ${{ vars.HYBRID_MODEL_VERSION_ID }}
      HYBRID_MODEL_SHA256: ${{ vars.HYBRID_MODEL_SHA256 }}
      SLM_MODEL_S3_BUCKET: ${{ vars.SLM_MODEL_S3_BUCKET }}
      SLM_MODEL_S3_KEY: ${{ vars.SLM_MODEL_S3_KEY }}
      SLM_MODEL_S3_VERSION_ID: ${{ vars.SLM_MODEL_S3_VERSION_ID }}
      SLM_MODEL_SHA256: ${{ vars.SLM_MODEL_SHA256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify pilot configuration
        env:
          ROLE_ARN: ${{ vars.HYBRID_AWS_DEPLOY_ROLE_ARN }}
          HYBRID_ECS_CLUSTER: ${{ vars.HYBRID_ECS_CLUSTER }}
          HYBRID_ECS_SERVICE: ${{ vars.HYBRID_ECS_SERVICE }}
          DEPLOY_SERVICE: ${{ inputs.deploy_service }}
        run: |
          required=(ROLE_ARN HYBRID_MODEL_BUCKET HYBRID_MODEL_VERSION_ID HYBRID_MODEL_SHA256)
          if [[ "$DEPLOY_SERVICE" == true ]]; then
            required+=(HYBRID_ECS_CLUSTER HYBRID_ECS_SERVICE ECS_EXECUTION_ROLE_ARN HYBRID_TASK_ROLE_ARN API_KEY_SECRET_ARN TOKEN_KEY_SECRET_ARN SLM_MODEL_S3_BUCKET SLM_MODEL_S3_KEY SLM_MODEL_S3_VERSION_ID SLM_MODEL_SHA256)
            [[ "$SLM_MODEL_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'SLM_MODEL_SHA256 must be hex' >&2; exit 1; }
          fi
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions variable: $name" >&2
              exit 1
            fi
          done
          [[ "$HYBRID_MODEL_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'HYBRID_MODEL_SHA256 must be lowercase hex' >&2; exit 1; }

      - name: Check GitHub OIDC identity
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          url += separator + urllib.parse.urlencode({"audience": "sts.amazonaws.com"})
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
          })
          with urllib.request.urlopen(request, timeout=15) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print(json.dumps({key: claims.get(key) for key in ("sub", "aud", "repository", "ref")}))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.HYBRID_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch pinned Hybrid artifact
        run: |
          aws s3api get-object \
            --bucket "$HYBRID_MODEL_BUCKET" \
            --key "$HYBRID_MODEL_S3_KEY" \
            --version-id "$HYBRID_MODEL_VERSION_ID" \
            hybrid-model.zip > /dev/null
          echo "$HYBRID_MODEL_SHA256  hybrid-model.zip" | sha256sum --check
          mkdir .hybrid-model
          python -m zipfile -e hybrid-model.zip .hybrid-model

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build pilot image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --tag "$IMAGE" .
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Verify Hybrid classifier and security rules in built image
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          docker run --rm --entrypoint python \
            --volume "$PWD/.hybrid-model:/model:ro" \
            --env PHISHARG_HYBRID_MODEL_DIR=/model \
            "$IMAGE" scripts/smoke_hybrid.py

      - name: Push image to Amazon ECR
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: docker push "$IMAGE"

      - name: Render task configuration
        if: inputs.deploy_service
        run: python scripts/render_hybrid_task.py

      - name: Insert immutable image tag
        if: inputs.deploy_service
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: hybrid-task-rendered.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy separate Hybrid ECS service
        if: inputs.deploy_service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ vars.HYBRID_ECS_CLUSTER }}
          service: ${{ vars.HYBRID_ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Verify public readiness when URL is configured
        if: inputs.deploy_service && vars.HYBRID_PUBLIC_URL != ''
        env:
          HYBRID_PUBLIC_URL: ${{ vars.HYBRID_PUBLIC_URL }}
        run: |
          curl --fail --show-error --silent --max-time 30 \
            "${HYBRID_PUBLIC_URL%/}/api/v1/health/ready"
